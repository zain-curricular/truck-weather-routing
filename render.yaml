services:
  - type: web
    name: truck-routing-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi --workers 2 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: TOMTOM_API_KEY
        sync: false
      # Change both hostnames if Render assigns different service URLs.
      - key: DJANGO_ALLOWED_HOSTS
        value: truck-routing-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://truck-routing-web.onrender.com
      # Set after checking X-Forwarded-For in the service logs; see README.
      - key: NUM_PROXIES
        sync: false

  - type: web
    name: truck-routing-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_BASE_URL
        value: https://truck-routing-api.onrender.com
